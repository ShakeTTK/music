<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="千字水印">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563a8"/>
      <stop offset="1" stop-color="#1b4f86"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="120" fill="url(#bg2)"/>
  <rect x="46" y="46" width="420" height="420" rx="88" fill="none" stroke="#dbeaf7" stroke-opacity=".55" stroke-width="3"/>
  <rect x="66" y="66" width="380" height="380" rx="72" fill="none" stroke="#dbeaf7" stroke-opacity=".22" stroke-width="1.5"/>
  <!-- 千（印章风格，笔画更粗） -->
  <g stroke="#f4faff" stroke-width="30" stroke-linecap="round" fill="none">
    <path d="M166 196 L350 196"/>
    <path d="M258 138 L258 384"/>
    <path d="M170 122 L248 180"/>
  </g>
  <!-- 水印波纹 -->
  <g fill="none" stroke="#cfe6f8" stroke-opacity=".55" stroke-width="5" stroke-linecap="round">
    <path d="M140 412 Q196 396 252 412 T364 412 T452 412"/>
    <path d="M140 440 Q196 424 252 440 T364 440 T452 440" opacity=".45"/>
  </g>
  <!-- 角落的小水点 -->
  <circle cx="150" cy="366" r="5" fill="#e6f2fc" opacity=".8"/>
  <circle cx="410" cy="128" r="4" fill="#e6f2fc" opacity=".6"/>
</svg>
