<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="月下涟漪">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1424"/>
      <stop offset="1" stop-color="#14314a"/>
    </linearGradient>
    <linearGradient id="stroke1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eaf5ff"/>
      <stop offset="1" stop-color="#a9cfe9"/>
    </linearGradient>
    <linearGradient id="wave1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6fa8cf" stop-opacity="0"/>
      <stop offset=".5" stop-color="#8fc4e6" stop-opacity=".85"/>
      <stop offset="1" stop-color="#6fa8cf" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="120" fill="url(#bg1)"/>
  <circle cx="256" cy="256" r="196" fill="none" stroke="#8fc4e6" stroke-opacity=".28" stroke-width="2"/>
  <circle cx="256" cy="256" r="216" fill="none" stroke="#8fc4e6" stroke-opacity=".12" stroke-width="1.5"/>
