<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="三道水波">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1626"/>
      <stop offset="1" stop-color="#0b1626"/>
    </linearGradient>
    <linearGradient id="line3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2f8ff"/>
      <stop offset="1" stop-color="#8ec5e9"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="120" fill="url(#bg3)"/>
  <circle cx="256" cy="256" r="196" fill="none" stroke="#8ec5e9" stroke-opacity=".2" stroke-width="2"/>
  <!-- 用三道流动的水线构成抽象的「千」 -->
  <g fill="none" stroke="url(#line3)" stroke-linecap="round">
    <path d="M120 256 Q176 224 232 256 T344 256 T438 232" stroke-width="20"/>
    <path d="M256 148 Q268 214 256 280 T268 424" stroke-width="20"/>
    <path d="M166 136 Q208 178 250 220" stroke-width="20" opacity=".9"/>
  </g>
  <!-- 水波点缀 -->
  <g fill="none" stroke="#8ec5e9" stroke-opacity=".42" stroke-width="4" stroke-linecap="round">
    <path d="M120 330 Q176 312 232 330 T344 330 T438 330"/>
    <path d="M120 356 Q176 338 232 356 T344 356 T438 356" opacity=".55"/>
  </g>
  <circle cx="392" cy="150" r="6" fill="#eaf4ff" opacity=".85"/>
</svg>
