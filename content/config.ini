# ============================================================
#  站点功能开关（本文件会提交到公开仓库，请不要放密钥）
#  每个模块相互独立：某一项写错/关掉，只会影响该功能，不会让整个站点失败
# ============================================================

[site]
# 站点标题、语言、网址（域名保持现有）
title = 千里的音乐小站
language = zh-hans-cn
base_url = https://shakettk.github.io/music/

[artist]
# 艺术家名固定为「千里」
# 简介/头像/社交链接请放在 content/artist/ 目录（见说明文档）
name = 千里
permalink = qianli
synopsis = 千里的音乐小站，一些自己的音乐。

[theme]
# dark / light / adaptive（adaptive = 跟随系统深浅色）
mode = dark

[brand]
# 站点 LOGO / favicon 版本：1 月下涟漪 / 2 千字水印 / 3 三道水波
# 改这里就能切换；SVG 文件在 docs/logo-proposals/
logo = 3

[water]
# 水面涟漪效果：鼠标滑动/点击产生波纹
enabled = true
strength = 1.2
opacity = 0.55

[comments]
# 折叠评论窗口
# 需要：GitHub 仓库启用 Discussions，然后到 https://giscus.app 获取 repo_id 和 category_id
enabled = true
repo = ShakeTTK/music
repo_id = R_kgDOT-f_QQ
category = General
category_id = DIC_kwDOT-f_Qc4DJavq
[analytics]
# 低调访问统计（页面不显示任何东西）
# token 建议放在 GitHub Actions Secret（名为 SITE_ANALYTICS_TOKEN），不要写进本文件
enabled = true
provider = cloudflare
token =

[embed]
# 嵌入播放器（允许别人把播放器嵌到自己的网页）
enabled = true

